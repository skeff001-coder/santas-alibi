workflows:
  santas-alibi-ios:
    name: Santa's Alibi iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ONJJEM Codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onjjem.santasalibi
      vars:
        XCODE_WORKSPACE: SantasAlibi.xcworkspace
        XCODE_SCHEME: SantasAlibi
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Set build number
        script: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.ios.buildNumber=String(process.env.PROJECT_BUILD_NUMBER);fs.writeFileSync('app.json',JSON.stringify(a,null,2));"
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios
      - name: Set up code signing
        script: |
          cd ios
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" || { echo "=== XCODEBUILD ERRORS ==="; grep -h "error:" /tmp/xcodebuild_logs/*.log | head -30; echo "=== LOG TAIL ==="; tail -40 /tmp/xcodebuild_logs/*.log; exit 1; }
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
